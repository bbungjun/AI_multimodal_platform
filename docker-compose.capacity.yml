# Isolated mock capacity profile used by scripts/image_load.py only.
# Connection budget: 8 API * 5 + 16 worker * 1 + 1 dispatcher + 1 observer = 58.
services:
  backend:
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "8", "--backlog", "16384", "--no-access-log"]
    cpus: 8
    mem_limit: 4g
    environment:
      AI_PROVIDER: mock
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "0"
      API_REQUEST_CONCURRENCY: "4"
      API_REQUEST_MAX_WAITERS: "2500"
      API_REQUEST_WAIT_TIMEOUT_SEC: "160"
  worker:
    command: ["celery", "-A", "app.celery_app", "worker", "--hostname=worker@%h", "--loglevel=warning", "--queues=generation", "--concurrency=16"]
    cpus: 8
    mem_limit: 4g
    environment:
      AI_PROVIDER: mock
      DATABASE_POOL_SIZE: "1"
      DATABASE_MAX_OVERFLOW: "0"
      CELERY_WORKER_CONCURRENCY: "16"
      RATE_LIMIT_IMAGEN_PER_MIN: "60000"
  dispatcher:
    cpus: 1
    mem_limit: 256m
    environment:
      AI_PROVIDER: mock
      DATABASE_POOL_SIZE: "1"
      DATABASE_MAX_OVERFLOW: "0"
      OUTBOX_DISPATCHER_BATCH_SIZE: "200"
      OUTBOX_DISPATCHER_POLL_INTERVAL_SEC: "0.1"
  db:
    cpus: 4
    mem_limit: 2g
