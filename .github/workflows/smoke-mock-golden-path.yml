name: Smoke Mock Golden Path

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_PROVIDER: mock
      GOOGLE_APPLICATION_CREDENTIALS: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate compose config
        run: docker compose --env-file .env.example config --quiet

      # Each cycle has a 360s deadline plus 90s owned cleanup. No raw log dump.
      # The runner owns finally cleanup; forced cancellation may interrupt it.
      - name: Run isolated authenticated mock scenarios twice
        run: python scripts/verify_ownership.py --env-file .env.example --cycles 2
